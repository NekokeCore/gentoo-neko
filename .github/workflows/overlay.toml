["net-im/gugu-bin"]
source = "regex"
url = "https://download.gugu.nextmind.space/releases/desktop/latest/latest-linux.yml"
regex = '(?m)^version: ([0-9]+\.[0-9]+\.[0-9]+)$'
github_account = "NekokeCore"
["www-client/roxybrowser-bin"]
source = "regex"
url = "https://roxybrowser.cn/app_statistics/get_version_list?os=Linux&osBit=64&page_index=1&page_size=10"
regex = '"versionType"\s*:\s*"app"[^}]*"version"\s*:\s*"([0-9]+\.[0-9]+\.[0-9]+)"'
github_account = "NekokeCore"
